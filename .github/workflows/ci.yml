name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Pint & PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        # Several views render @vite(...); without a build, any test that
        # renders one of those views fails on a missing manifest, not on
        # anything the test itself is checking.
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        # Non-blocking for now: a large share of the existing codebase predates
        # this check and hasn't been reformatted yet (tracked as follow-up
        # cleanup work, not part of this milestone). Style issues are still
        # reported on every run; they just don't fail the build yet.
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Run test suite
        run: php artisan test
